spring.application.name=cita-service-grupo08
spring.profiles.active=dev
# El Config Server entrega cita-service-dev.properties antes de crear el contexto Spring.
spring.config.import=optional:configserver:http://localhost:8888

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:h2:mem:citadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.cloud.config.uri=http://localhost:8888

# Permite recargar las propiedades remotas sin reiniciar cita-service.
management.endpoints.web.exposure.include=refresh,health,info
